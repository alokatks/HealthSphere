spring.application.name=HealthSphere

spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.datasource.url=jdbc:mysql://localhost:3306/healthsphere_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway now owns schema changes (see db/migration/V1__init.sql) instead of
# Hibernate's ddl-auto=update. baseline-on-migrate + baseline-version=1 means:
#   - on your EXISTING dev database (already has tables, no flyway history
#     table yet), Flyway marks V1 as already applied without running it —
#     your current data/schema is left untouched.
#   - on a genuinely EMPTY database (fresh clone, CI, new environment),
#     baseline does not trigger, so V1 runs for real and builds the schema.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.jwt-secret=${JWT_SECRET:a_very_long_and_secure_random_key_that_is_used_to_sign_the_jwts}
app.jwt-expiration-milliseconds=604800000

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME:74a619d121eda1}
spring.mail.password=${MAIL_PASSWORD:7fdbbaef65828d}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

logging.level.org.springframework.mail=INFO

# URL of the frontend app, used to build links (e.g. password reset) sent in emails.
app.frontend-url=http://localhost:5173

# Comma-separated list of origins allowed to call this API.
# Add your deployed frontend's URL here when you go to production.
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# File upload limits (Item 8)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB